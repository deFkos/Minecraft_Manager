appId: com.neocraft.control
productName: NeoCraft Control
copyright: Copyright © 2026 NeoCraft Control
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - backend/sandboxRunner.mjs
  - package.json
asarUnpack:
  - backend/sandboxRunner.mjs
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  signAndEditExecutable: false
  artifactName: NeoCraft-Control-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NeoCraft Control
  runAfterFinish: true
  installerLanguages:
    - ru_RU
    - en_US
  language: "1049"
  include: build/installer.nsh
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Utility
  artifactName: NeoCraft-Control-${version}.${ext}
