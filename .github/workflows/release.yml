name: Build Windows Installer (Setup.exe) & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза (оставьте пустым для автотега v<версия из package.json>)'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Setup.exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        run: npm run lint

      - name: Build Windows Installer (NeoCraft-Control-Setup.exe)
        run: npm run electron:build:win

      - name: Verify built Setup.exe
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path release -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $exeFiles -or $exeFiles.Count -eq 0) {
            Write-Error "Setup.exe was not generated in release/"
            exit 1
          }
          $exeFiles | Format-Table Name, Length

      - name: Upload Windows Setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoCraft-Control-Windows-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux Installers (AppImage & deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build AppImage & deb
        run: npm run electron:build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeoCraft-Control-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          REF_FULL: ${{ github.ref }}
          REF_SHORT: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          APP_VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          if [[ "$REF_FULL" == refs/tags/v* ]]; then
            TAG="$REF_SHORT"
          elif [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${APP_VERSION}"
          fi
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag resolved to: ${TAG}"
          ls -la artifacts/NeoCraft-Control-Windows-Setup/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NeoCraft Control ${{ steps.tag.outputs.tag_name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            artifacts/NeoCraft-Control-Windows-Setup/*.exe
            artifacts/NeoCraft-Control-Linux/*.AppImage
            artifacts/NeoCraft-Control-Linux/*.deb
