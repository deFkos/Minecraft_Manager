name: Build Desktop Installers (Setup.exe & AppImage)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows Installer (Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build NeoCraft-Control-Setup.exe
        run: npm run electron:build:win

      - name: Upload Setup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoCraft-Control-Windows-Setup
          path: release/*.exe

  build-linux:
    name: Linux Installers (AppImage & deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build AppImage & deb
        run: npm run electron:build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NeoCraft-Control-Linux
          path: |
            release/*.AppImage
            release/*.deb

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/NeoCraft-Control-Windows-Setup/*.exe
            artifacts/NeoCraft-Control-Linux/*.AppImage
            artifacts/NeoCraft-Control-Linux/*.deb
